<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form id="form-login">
            <div class="input-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>

            <!-- 1. CASILLA RECAPTCHA V2 -->
            <div class="g-recaptcha" data-sitekey="6LftCwEuAAAAAIDSdFlcWuctrddwuhyhiJ2OevhV" style="margin: 15px 0;"></div>

            <button type="submit">Entrar</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

        <!-- 2. BOTÓN DE GOOGLE LOGIN -->
        <div style="text-align: center; margin-bottom: 15px;">
            <p style="margin-bottom: 10px; color: #666;">O inicia sesión con:</p>
            <div id="buttonDiv" style="display: flex; justify-content: center;"></div>
        </div>

        <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        <div id="mensaje-error" style="color: red;"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
