<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <h2>Crear Cuenta</h2>
        <form id="form-registro">
            <div class="input-group">
                <label for="reg-name">Nombre:</label>
                <input type="text" id="reg-name" required>
            </div>
            <div class="input-group">
                <label for="reg-surname">Apellidos:</label>
                <input type="text" id="reg-surname">
            </div>
            <div class="input-group">
                <label for="reg-nick">Nick / Usuario:</label>
                <input type="text" id="reg-nick" required>
            </div>
            <div class="input-group">
                <label for="reg-email">Correo Electrónico:</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="input-group">
                <label for="reg-password">Contraseña:</label>
                <input type="password" id="reg-password" required>
            </div>
            
            <!-- CAMPO DE IMAGEN AÑADIDO -->
            <div class="input-group">
                <label for="reg-file">Foto de Perfil (Opcional):</label>
                <input type="file" id="reg-file" accept="image/png, image/jpeg, image/jpg, image/gif">
            </div>

            <!-- CASILLA RECAPTCHA (tambien requerida al registrarse) -->
            <div class="g-recaptcha" data-sitekey="6LftCwEuAAAAAIDSdFlcWuctrddwuhyhiJ2OevhV" style="margin: 15px 0;"></div>

            <button type="submit">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        <div id="mensaje-error" style="color: red; margin-top: 10px;"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
