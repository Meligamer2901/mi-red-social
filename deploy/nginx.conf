# nginx delante de la app. Sirve el frontend React compilado (frontend/dist)
# y reenvia /api e /imagenes al backend Node (PM2, puerto 4000).
# El script deploy/ec2-bootstrap.sh reemplaza __PROYECTO_DIR__ por la ruta real.
#
# Reemplaza "_" por tu dominio de Route 53 cuando lo tengas (ej: miredsocial.com).

server {
    listen 80;
    server_name _;

    # Las fotos pueden pesar varios MB; debe ser >= al limite de multer (15 MB).
    client_max_body_size 20M;

    root __PROYECTO_DIR__/frontend/dist;
    index index.html;

    # API (Express)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Imagenes guardadas en modo local (con STORAGE_DRIVER=s3 no se usa)
    location /imagenes/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # Frontend React (rutas del lado del cliente -> index.html)
    location / {
        try_files $uri /index.html;
    }
}

# HTTPS (una vez tengas el dominio en Route 53):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d tu-dominio.com
