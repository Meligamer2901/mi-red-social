# Configuracion de nginx como reverse proxy delante de la app Node (PM2,
# puerto 4000). Copiar a /etc/nginx/sites-available/mi-red-social y luego:
#
#   sudo ln -s /etc/nginx/sites-available/mi-red-social /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reemplaza "tu-dominio.com" por el dominio/subdominio creado en Route 53
# (ver docs/DESPLIEGUE.md). Si todavia no tienes dominio, deja "_" para que
# responda a cualquier nombre/IP mientras tanto.

server {
    listen 80;
    server_name tu-dominio.com; # o "_" si aun no tienes dominio en Route 53

    # Las fotos pueden pesar varios MB; debe ser >= al limite de multer
    # (15 MB, ver rutas/rutas.js).
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Para HTTPS (recomendado una vez tengas el dominio en Route 53):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tu-dominio.com
# Certbot reescribe este archivo automaticamente agregando el bloque de
# "listen 443 ssl" y la redireccion de 80 -> 443.
