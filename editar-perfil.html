<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <a href="perfil.html">&larr; Volver al Perfil</a>
        <h2>Editar Perfil</h2>

        <!-- Formulario Datos Generales -->
        <form id="form-editar-perfil">
            <div class="input-group">
                <label for="edit-user-name">Nombre:</label>
                <input type="text" id="edit-user-name">
            </div>
            <div class="input-group">
                <label for="edit-user-surname">Apellidos:</label>
                <input type="text" id="edit-user-surname">
            </div>
            <div class="input-group">
                <label for="edit-user-nick">Nick:</label>
                <input type="text" id="edit-user-nick">
            </div>
            <div class="input-group">
                <label for="edit-user-email">Email:</label>
                <input type="email" id="edit-user-email">
            </div>
            <div class="input-group">
                <label for="edit-user-password">Nueva Contraseña (dejar en blanco para no cambiar):</label>
                <input type="password" id="edit-user-password">
            </div>
            <button type="submit">Guardar Datos</button>
        </form>

        <hr>

        <!-- Formulario Subir Avatar -->
        <h3>Cambiar Foto de Perfil</h3>
        <form id="form-subir-avatar">
            <div class="input-group">
                <input type="file" id="avatar-file" accept="image/*" required>
            </div>
            <button type="submit">Subir Avatar</button>
        </form>

        <div id="mensaje-estado"></div>
    </div>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
