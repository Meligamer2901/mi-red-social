<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Red Social</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Header de Usuario -->
    <header class="navbar">
        <h1>Red Social</h1>
        <div id="usuario-header">
            <!-- Se llena dinámicamente desde app.js -->
        </div>
    </header>

    <div class="container" id="detalle-perfil">
        <h2>Perfil de Usuario</h2>

        <!-- Información del Perfil -->
        <div class="card-articulo" style="align-items: center; text-align: center; padding: 2rem;">
            <img id="perfil-avatar" src="default-avatar.png" onclick="const u = JSON.parse(localStorage.getItem('user') || '{}'); if (u.imageUrl) abrirModalFiltro(u.imageUrl, 'perfil', u.id || u._id, u.id || u._id)" width="130" height="130"
                style="border-radius: 50%; object-fit: cover; margin-bottom: 1rem;">
            <h3 id="perfil-nombre">Cargando...</h3>
            <p><strong>Usuario:</strong> @<span id="perfil-nick">...</span></p>

            <!-- Botón Editar Perfil -->
            <a href="editar-perfil.html" id="btn-editar-perfil-link" style="margin-top: 10px; display: none;">
                <button type="button" class="btn-editar">Actualizar Perfil</button>
            </a>
        </div>

        <!-- Botón para abrir el Modal de Crear Publicación-->
        <div id="seccion-crear-post" style="display: none; margin: 1.5rem 0; text-align: center;">
            <button type="button" class="btn-crearPost" onclick="abrirModalCrear()">+ Crear Nueva Publicación</button>
        </div>

        </section>
        <!-- Sección donde se listan las publicaciones del usuario -->
        <section>
            <h3>Publicaciones</h3>
            <div id="mis-publicaciones" class="grid-articulos" style="margin-top: 1rem;">
                <!-- Las publicaciones se cargan dinámicamente desde app.js -->
            </div>
        </section>
    </div>

    <!-- Modal para Crear Publicación -->
    <div id="modal-crear-post" class="modal oculto">
        <div class="modal-contenido">
            <span onclick="cerrarModalCrear()" class="cerrar">&times;</span>
            <h2>Crear Publicación</h2>

            <form id="form-crear-post">
                <div class="input-group">
                    <label for="post-contenido">Contenido:</label>
                    <textarea id="post-contenido" rows="4" placeholder="¿Qué estás pensando?" required></textarea>
                </div>

                <div class="input-group">
                    <label for="post-file">Imagen (Opcional):</label>
                    <input type="file" id="post-file" accept="image/png, image/jpeg, image/jpg, image/gif">
                </div>

                <button type="submit">Publicar</button>
            </form>
        </div>
    </div>

    <!-- Modal para Editar Publicación -->
    <div id="modal-editar-post" class="modal oculto">
        <div class="modal-contenido">
            <span onclick="cerrarModalEditar()" class="cerrar">&times;</span>
            <h2>Editar Publicación</h2>

            <form id="form-editar-post">
                <input type="hidden" id="edit-post-id">
                <div class="input-group">
                    <label for="edit-post-contenido">Contenido:</label>
                    <textarea id="edit-post-contenido" rows="4" required></textarea>
                </div>

                <button type="submit">Guardar Cambios</button>
            </form>
        </div>
    </div>

   <!-- Modal Editor de Filtros (perfil.html) -->
<div id="modal-filtro" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="display: flex; gap: 20px; max-width: 900px; width: 90%; position: relative;">
        <span class="btn-close" onclick="cerrarModalFiltro()">&times;</span>
        
        <!-- Columna Izquierda: Previsualización, Filtros y Acciones -->
        <div style="flex: 1; min-width: 0;">
            <h3>Filtros de Imagen</h3>
            
            <!-- Área de vista previa -->
            <div class="preview-container">
                <img id="img-preview" src="" alt="Vista Previa">
            </div>

            <!-- Transformaciones automaticas (miniatura / blanco y negro / sepia) -->
            <div id="galeria-transformaciones" style="display:none; margin-bottom: 10px;"></div>

            <!-- Galería de 10 filtros con ejemplo -->
            <div class="filtros-grid">
                <button type="button" class="btn-filtro active" data-filtro="normal" onclick="seleccionarFiltro('normal', this)">
                    <span class="thumb-preview f-normal"></span>
                    <span>Normal</span>
                </button>
                <button type="button" class="btn-filtro" data-filtro="grayscale" onclick="seleccionarFiltro('grayscale', this)">
                    <span class="thumb-preview f-grayscale"></span>
                    <span>Blanco y Negro</span>
                </button>
                <button type="button" class="btn-filtro" data-filtro="sepia" onclick="seleccionarFiltro('sepia', this)">
                    <span class="thumb-preview f-sepia"></span>
                    <span>Sepia</span>
                </button>
                <button type="button" class="btn-filtro" data-filtro="invert" onclick="seleccionarFiltro('invert', this)">
                    <span class="thumb-preview f-invert"></span>
                    <span>Negativo</span>
                </button>
                <button type="button" class="btn-filtro" data-filtro="blur" onclick="seleccionarFiltro('blur', this)">
                    <span class="thumb-preview f-blur"></span>
                    <span>Desenfoque</span>
                </button>
                <button type="button" class="btn-filtro" data-filtro="bright" onclick="seleccionarFiltro('bright', this)">
                    <span class="thumb-preview f-bright"></span>
                    <span>Brillo</span>
                </button>
                <button type="button" class="btn-filtro" data-filtro="contrast" onclick="seleccionarFiltro('contrast', this)">
                    <span class="thumb-preview f-contrast"></span>
                    <span>Contraste</span>
                </button>
                <button type="button" class="btn-filtro" data-filtro="warm" onclick="seleccionarFiltro('warm', this)">
                    <span class="thumb-preview f-warm"></span>
                    <span>Cálido</span>
                </button>
                <button type="button" class="btn-filtro" data-filtro="cool" onclick="seleccionarFiltro('cool', this)">
                    <span class="thumb-preview f-cool"></span>
                    <span>Frío</span>
                </button>
                <button type="button" class="btn-filtro" data-filtro="hue" onclick="seleccionarFiltro('hue', this)">
                    <span class="thumb-preview f-hue"></span>
                    <span>Psicodélico</span>
                </button>
            </div>

            <!-- Acciones -->
            <div class="modal-actions" style="margin-top: 15px; display: flex; gap: 10px; align-items: center; justify-content: flex-end;">
                <span id="txt-modo-lectura" style="display: none; color: #777; font-size: 0.9em;">
                    Modo vista previa
                </span>
                
                <!-- Botón de Análisis Facial -->
                <button type="button" class="btn-analisis" onclick="ejecutarAnalisisFacial()" style="background-color: #28a745; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    Analizar Rostro
                </button>
                
                <button type="button" id="btn-guardar-filtro" class="btn-guardar" onclick="guardarFiltroEnServidor()">Guardar Cambios</button>
            </div>
        </div>

        <!-- Columna Derecha: Panel de Resultados del Análisis Facial (Oculto por defecto) -->
        <div id="panel-reconocimiento" style="display: none; flex: 0.8; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; max-height: 80vh; overflow-y: auto;">
            <h4 style="margin-top: 0; color: #333; border-bottom: 2px solid #28a745; padding-bottom: 5px;">Resultados del Análisis</h4>
            <div id="contenido-analisis">
                <!-- Se inyectan las métricas de edad, género y total de rostros -->
            </div>
        </div>
    </div>
</div>

    <!-- Barra de Navegación Inferior -->
    <nav class="bottom-nav-bar">
        <div class="bottom-nav-container" id="bottom-nav-container" data-tab="2">
            <div class="nav-slider-indicator"></div>

            <a href="index.html" class="bottom-nav-item" id="nav-global">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg>
                <span>Feed Global</span>
            </a>

            <a href="siguiendo.html" class="bottom-nav-item" id="nav-siguiendo">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" /></svg>
                <span>Siguiendo</span>
            </a>

            <a href="perfil.html" class="bottom-nav-item" id="nav-perfil">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" /></svg>
                <span>Mi Perfil</span>
            </a>
        </div>
    </nav>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
